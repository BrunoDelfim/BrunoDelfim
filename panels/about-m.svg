<svg xmlns="http://www.w3.org/2000/svg" width="288" height="902" viewBox="0 0 288 902" shape-rendering="crispEdges" role="img" aria-label="Bruno Delfim. Mid-level developer working across the web, desktop, and mobile stack with 12+ years of professional experience—spanning early foundations in Pascal, Delphi, and Java to modern full-stack systems. I handle everything from responsive frontend interfaces to solid database design, automation, and clean backend architectures in PHP/Laravel, Python, and JavaScript/TypeScript, prioritizing scalable code over micro-optimizations. Rooted in Arch Linux and Docker for local environments. Outside of code, I'm pursuing my postgrad in AI &amp; Machine Learning at PUC Minas. When offline, I enjoy quality time with my family, reading, gaming, driving, and listening to music. Currently exploring: Expanding to Angular &amp; React Ecosystems, Applied AI &amp; ML Models (PUC Minas), Media Streaming Pipelines &amp; Buffer Management, Metadata Extraction &amp; Real-Time File Conversion. Mentoring junior peers to deliver high-impact, business-aligned results. Building software with high technical clarity and long-term maintainability. Driving continuous team growth by introducing and sharing new knowledge."><title>Bruno Delfim. Mid-level developer working across the web, desktop, and mobile stack with 12+ years of professional experience—spanning early foundations in Pascal, Delphi, and Java to modern full-stack systems. I handle everything from responsive frontend interfaces to solid database design, automation, and clean backend architectures in PHP/Laravel, Python, and JavaScript/TypeScript, prioritizing scalable code over micro-optimizations. Rooted in Arch Linux and Docker for local environments. Outside of code, I'm pursuing my postgrad in AI &amp; Machine Learning at PUC Minas. When offline, I enjoy quality time with my family, reading, gaming, driving, and listening to music. Currently exploring: Expanding to Angular &amp; React 